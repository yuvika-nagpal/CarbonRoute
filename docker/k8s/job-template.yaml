apiVersion: batch/v1
kind: Job
metadata:
  name: carbonroute-job-sample
  namespace: default
  labels:
    app.kubernetes.io/name: carbonroute
    app.kubernetes.io/component: batch-workload
    carbonroute.org/scheduler: uncertainty-aware
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: carbonroute-workload
    spec:
      restartPolicy: Never
      containers:
      - name: batch-worker
        image: carbonroute/test-workload:latest
        imagePullPolicy: IfNotPresent
        command: ["python", "workload.py", "--duration-sec", "15"]
        resources:
          requests:
            cpu: "500m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "512Mi"
        env:
        - name: JOB_ID
          value: "job-sample"
        - name: REGION
          value: "US-CAL-CISO"
